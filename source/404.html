<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · 青羽的博客</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        font:
          16px/1.7 -apple-system,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        background: #fafafa;
        color: #333;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      .code {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0;
        color: #bbb;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0.75rem 0 0;
      }
      p {
        margin: 0.9rem 0 0;
        color: #777;
        font-size: 0.95rem;
      }
      #hint {
        color: #999;
        font-size: 0.85rem;
      }
      nav {
        margin-top: 1.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        justify-content: center;
      }
      nav a {
        padding: 0.4rem 0.9rem;
        border: 1px solid #ddd;
        border-radius: 999px;
        color: #555;
        text-decoration: none;
        font-size: 0.9rem;
      }
      nav a:hover {
        border-color: #999;
        color: #222;
      }
      a {
        color: #4a7ebb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1b1b;
          color: #ccc;
        }
        .code {
          color: #555;
        }
        p {
          color: #999;
        }
        nav a {
          border-color: #3a3a3a;
          color: #bbb;
        }
        nav a:hover {
          border-color: #666;
          color: #eee;
        }
        a {
          color: #7aa7d8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>这个地址不存在，或者已经失效了</h1>
      <p id="hint" hidden></p>
      <nav>
        <a href="/">首页</a>
        <a href="/categories/">分类</a>
        <a href="/tags/">标签</a>
        <a href="/archives/">归档</a>
        <a href="/about/">关于</a>
      </nav>
    </main>
    <script>
      /* 旧地址不做名单，按路径前缀送回对应的总览页 */
      (function () {
        function redirectTarget(pathname) {
          if (/^\/categories(\/|$)/.test(pathname)) return "/categories/";
          if (/^\/tags(\/|$)/.test(pathname)) return "/tags/";
          return "/";
        }
        var target = redirectTarget(location.pathname);
        if (target === location.pathname) return;
        var hint = document.getElementById("hint");
        if (hint) {
          hint.hidden = false;
          hint.textContent = "正在前往 " + target;
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
